plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.todokanai.composepracticenew'
    compileSdk 35

    defaultConfig {
        applicationId "com.todokanai.composepracticenew"
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseLocal {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// data를 runtimeOnly로 둬도 data의 Hilt 모듈을 찾도록 집계 태스크를 쓴다(기본값이지만 아래 의존이 기대므로 명시)
hilt {
    enableAggregatingTask = true
}

dependencies {

    implementation project(':domain')
    implementation project(':core')
    // app 코드가 data의 클래스·리소스를 컴파일 단계에서 참조하지 못하게 runtimeOnly로 둔다 — implementation으로 되돌리지 않는다(#232)
    runtimeOnly project(':data')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3

    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.hilt.navigation.compose

    implementation libs.androidx.navigation.compose
    implementation libs.coil.compose
    // Compose 등 라이브러리에 포함된 Baseline Profile을 Play 외 설치 경로에서도 적용
    implementation libs.androidx.profileinstaller

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation libs.hilt.android
    kapt libs.hilt.android.compiler
}